<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" rx="14" fill="#08090B"/>
  <rect x="2" y="2" width="60" height="60" rx="12" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/>
  
  <!-- Red Recording Accent Dot -->
  <circle cx="50" cy="14" r="4" fill="#E74747"/>
  
  <!-- Stylized PJ Monogram -->
  <text x="31" y="44" 
        text-anchor="middle" 
        font-family="Syne, system-ui, -apple-system, sans-serif" 
        font-size="28" 
        font-weight="900" 
        letter-spacing="1" 
        fill="#FFFFFF">
    PJ
  </text>
  
  <!-- Subtle corner registration notches -->
  <line x1="8" y1="8" x2="14" y2="8" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="8" y1="8" x2="8" y2="14" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="1.5"/>
</svg>
